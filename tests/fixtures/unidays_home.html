ist du hier genau richtig."}]}]},{"id":"7caba9bc7eaecb85c5a4ae4d","tracking":"how-does-unidays-work","question":[{"children":[{"text":"Wie funktioniert UNiDAYS?"}]}],"answer":[{"children":[{"text":"Studierende können "},{"bold":true,"text":"UNiDAYS "},{"text":"in nur fünf Minuten kostenlos beitreten. Registriere dich einfach mit deiner persönlichen E-Mail-Adresse, bestätige deinen Studierendenstatus und schon hast du zwölf Monate lang Zugang zu allen Studi-Angeboten bei "},{"bold":true,"text":"UNiDAYS"},{"text":". Keine Studi-Rabattkarte oder Studentenausweis nötig – "},{"bold":true,"text":"UNiDAYS "},{"text":"bietet dir die ganzen besten Studi-Rabatte unter einem Dach, nur einen Tap entfernt."}]},{"children":[{"text":""}]},{"children":[{"text":"Du musst deinen Studierendenstatus alle zwölf Monate erneut verifizieren, um weiterhin auf deine exklusiven Studi-Rabatte zuzugreifen. Aber keine Sorge, das geht ganz schnell und easy."}]}]},{"id":"23800a550fed0dfe387b7de6","tracking":"how-to-join-unidays-and-access-your-student-membership","question":[{"children":[{"text":"Wie kann ich UNiDAYS beitreten und auf meine Studi-Mitgliedschaft zugreifen? "}]}],"answer":[{"children":[{"text":"Wenn du dich jetzt fragst, wie du an deine Studi-Rabatte kommst, keine Sorge – die Registrierung könnte nicht einfacher sein. Registriere dich einfach für einen Account und folge dem einfachen Verifizierungsprozess. Sobald dieser abgeschlossen ist, hast du zwölf Monate lang Zugang zu exklusiven Rabatten und Angeboten."}]},{"children":[{"text":""}]},{"children":[{"text":"Du musst deinen Studierendenstatus alle zwölf Monate erneut bestätigen, um weiterhin auf deine exklusiven Studi-Rabattcodes zugreifen zu können – aber keine Sorge, das geht ganz schnell und easy."}]}]},{"id":"e3f2715f551a8c4dacc72f2d","tracking":"how-do-i-verify-my-student-status-to-become-a-unidays-student-member","question":[{"children":[{"text":"Wie kann ich meinen Studierendenstatus nachweisen und UNiDAYS-Member werden?"}]}],"answer":[{"children":[{"text":"Im "},{"bold":true,"text":"UNiDAYS"},{"text":"-Universum bedeutet Verifizierung lediglich, dass wir deinen Studierendenstatus überprüfen müssen – das geht echt easy. Klingt gut, aber wie komme ich an die Studi-Rabatte? Der erste Schritt ist die Verifizierung, und dafür gibt es mehrere Möglichkeiten."}]},{"children":[{"text":""}]},{"children":[{"text":"Für die meisten von uns anerkannten Hochschulen bieten wir eine umgehende automatische Verifizierung an. Sollte dies nicht möglich sein, können wir deinen Studierendenstatus anhand deines von deiner Schule, Fachhochschule oder Universität ausgestellten Studierendenausweises verifizieren. Beachte jedoch, dass diese Methode zu Stoßzeiten bis zu sieben Tage dauern kann."}]}]},{"id":"69cd8c2f0d544ff07140e1f8","tracking":"is-unidays-only-for-students","question":[{"children":[{"text":"Ist UNiDAYS nur etwas für Studierende?"}]}],"answer":[{"children":[{"text":"Ja, aber wir sind wirklich für ALLE Studierenden da. Das bedeutet, dass wir mit vielen Schulen und Hochschulen zusammenarbeiten, je nachdem, wo du bist. Wenn du derzeit an einer unserer teilnehmenden Bildungsstätten studierst und/oder einen gültigen Studierendenausweis besitzt, kannst du verifiziertes "},{"bold":true,"text":"UNiDAYS"},{"text":"-Mitglied werden."}]},{"children":[{"text":""}]},{"children":[{"text":"Nach Beendigung deines Studiums kannst du deinen Studi-Account nicht erneut verifizieren."}]}]},{"id":"bcf9d44d7d560d72278ea192","tracking":"is-unidays-a-valid-student-id","question":[{"children":[{"text":"Ist die UNiDAYS-ID ein gültiger Studierendenausweis?"}]}],"answer":[{"children":[{"text":"Wenn es um die besten Angebote und Rabatte bei unseren Markenpartnern geht, dann auf jeden Fall! Deine "},{"bold":true,"text":"UNiDAYS"},{"text":"-ID ist jedoch nicht dasselbe wie dein offizieller Studierendenausweis von deiner Bildungseinrichtung. Das bedeutet, dass du damit beispielsweise keinen Zugang zu bestimmten öffentlichen Gebäuden oder Bibliotheken erhältst."}]},{"children":[{"text":""}]},{"children":[{"bold":true,"text":"UNiDAYS "},{"text":"überprüft zwar deinen Studierendenstatus, aber die "},{"bold":true,"text":"UNiDAYS"},{"text":"-ID wird derzeit nicht überall als offizieller Studierendenausweis akzeptiert. Erkundige dich am besten im Voraus bei der Organisation, die du besuchen möchtest, wenn du nicht sicher bist."}]}]}],"blockType":"faqs"}]},"styling":{"isCurved":true,"width":"lg","columns":null,"spacing":null,"align":null,"valign":null},"background":{"bgColour":"#282828","bgImage":null,"bgVideo":null}}],"liveCampaignRoute":{"route":null,"redirectAnonHomepage":false},"hreflang":{"a":[["GY","en-GB"],["UA","uk-UA"],["ME","en-GB"],["MO","zh-HK"],["FJ","en-GB"],["LB","en-GB"],["TZ","en-GB"],["NI","es-MX"],["SS","en-GB"],["NO","nb-NO"],["BE","fr-BE"],["LR","en-GB"],["MY","ms-MY"],["NP","en-GB"],["AR","es-MX"],["UZ","en-GB"],["IN","en-IN"],["CI","en-GB"],["ST","en-GB"],["SB","en-GB"],["KI","en-GB"],["PS","en-GB"],["BM","en-GB"],["SK","sk-SK"],["KY","en-GB"],["SR","en-GB"],["SG","en-SG"],["MU","en-GB"],["DM","en-GB"],["ES","es-ES"],["UY","en-GB"],["TJ","en-GB"],["HT","en-GB"],["MX","es-MX"],["BI","en-GB"],["ZW","en-GB"],["HK","zh-HK"],["TH","th-TH"],["MV","en-GB"],["MR","en-GB"],["DJ","en-GB"],["HR","en-GB"],["GM","en-GB"],["LV","en-GB"],["HN","es-MX"],["AM","en-GB"],["CD","en-GB"],["KR","ko-KR"],["EC","es-MX"],["SO","en-GB"],["BO","es-MX"],["TC","en-GB"],["ZA","en-GB"],["AU","en-AU"],["BR","pt-BR"],["BJ","en-GB"],["ML","en-GB"],["TL","en-GB"],["VG","en-GB"],["VN","vi-VN"],["BT","en-GB"],["TN","en-GB"],["HU","hu-HU"],["KM","en-GB"],["NL","nl-NL"],["CZ","cs-CZ"],["IQ","en-GB"],["BH","en-GB"],["NA","en-GB"],["SE","sv-SE"],["MG","en-GB"],["LT","en-GB"],["IT","it-IT"],["MH","en-GB"],["TT","en-GB"],["CG","en-GB"],["BW","en-GB"],["QA","en-GB"],["AO","en-GB"],["SN","en-GB"],["TV","en-GB"],["XX","en-GB"],["FR","fr-FR"],["GR","el-GR"],["UG","en-GB"],["CW","en-GB"],["MS","en-GB"],["WS","en-GB"],["P
