name: offre-manuelle

# Ajout d'une offre vue en magasin via le formulaire d'issue « Offre vue en
# magasin » (utilisable depuis l'iPhone, photo de l'étiquette jointe). Aucun LLM :
# les champs du formulaire sont lus tels quels. Seul le propriétaire du dépôt
# peut ajouter une offre.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'offre-manuelle') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lire le formulaire
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > /tmp/issue.md
          python -m radar add-manual-from-issue --body-file /tmp/issue.md | tee /tmp/out.txt
      - name: Commit
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual.json
          git commit -m "data: offre manuelle (#${{ github.event.issue.number }}) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
      - name: Confirmer et relancer une collecte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ Offre enregistrée comme **vérifiée en magasin**. Elle apparaîtra au prochain relevé (lancé maintenant)."
          gh issue close ${{ github.event.issue.number }}
          gh workflow run scan.yml -f force=true
