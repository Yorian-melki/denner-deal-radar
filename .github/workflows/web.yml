name: web
# Site public (web/) : export statique Next.js → Cloudflare Pages.
# Reconstruit toutes les 2 h à partir du flux publié par le scanner (GitHub Pages),
# et à chaque modification de web/. Ne commite rien : aucun conflit avec radar-data.
on:
  schedule:
    - cron: "20 */2 * * *"
    # 00:01 et 18:01 heure suisse (UTC+1 en hiver, UTC+2 en été : les deux créneaux UTC),
    # puis 6 h : les actions terminées (et, à 18 h, les ventes en magasin du dernier jour)
    # quittent les listes sans attendre le créneau de 2 h (round 3, item 20).
    - cron: "1 22,23 * * *"
    - cron: "1 16,17 * * *"
    - cron: "5 5 * * *"
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Round 4, item 21 : le job qui exécute le code des dépendances (npm ci, next build) n'a
  # accès à AUCUN secret ; le déploiement est un job séparé, sans node_modules du dépôt.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SITE_NAME: ${{ vars.SITE_NAME }}
      # URL publique absolue (canonical, og, sitemap, partage). Sans variable de dépôt :
      # l'aperçu Pages. lib/site.ts fait échouer le build si elle est absente ou locale.
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://savradar.pages.dev' }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      NEXT_PUBLIC_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
      NEXT_PUBLIC_OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
      NEXT_PUBLIC_OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
      NEXT_PUBLIC_CMP_MODE: ${{ vars.CMP_MODE }}
      NEXT_PUBLIC_TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      AFF_TRADEDOUBLER_ID: ${{ vars.AFF_TRADEDOUBLER_ID }}
      AFF_TRADEDOUBLER_GALAXUS_P: ${{ vars.AFF_TRADEDOUBLER_GALAXUS_P }}
      AFF_TRADEDOUBLER_DIGITEC_P: ${{ vars.AFF_TRADEDOUBLER_DIGITEC_P }}
      AFF_AWIN_ID: ${{ vars.AFF_AWIN_ID }}
      AFF_AWIN_MIDS: ${{ vars.AFF_AWIN_MIDS }}
      AFF_AMAZON_DE_TAG: ${{ vars.AFF_AMAZON_DE_TAG }}
      AFF_ALIEXPRESS_TEMPLATE: ${{ vars.AFF_ALIEXPRESS_TEMPLATE }}
      AFF_BOOKING_AID: ${{ vars.AFF_BOOKING_AID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Garde-fous (taille Cloudflare, aucune URL locale)
        run: |
          n=$(find out -type f | wc -l)
          echo "fichiers: $n"
          test "$n" -lt 18000
          ! grep -rlE "https?://(localhost|127\.0\.0\.1)" out --include=*.html --include=*.xml --include=*.webmanifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: web/out
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: web/scripts/check-legacy.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Déploiement Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets Cloudflare absents — build vérifié, déploiement ignoré."
            exit 0
          fi
          # wrangler installé dans un dossier vide, sans scripts d'installation, version épinglée.
          mkdir -p "$RUNNER_TEMP/wr" && cd "$RUNNER_TEMP/wr"
          npm i --no-save --ignore-scripts --no-audit --no-fund wrangler@4.154.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wr/node_modules/.bin/wrangler" pages deploy out --project-name savradar --branch main --commit-dirty=true
      - name: Anciens liens deal (301 sans cache, cible 200, pas de DoubleClick)
        env:
          SITE: ${{ vars.SITE_URL || 'https://savradar.pages.dev' }}
        run: |
          sleep 20
          bash web/scripts/check-legacy.sh "$SITE" out/_redirects
