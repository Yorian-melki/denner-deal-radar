name: tests

on:
  push:
    paths-ignore: ["data/**", "site/data/**", "**.md"]
  pull_request:
  schedule:
    - cron: "41 4 * * 0"   # chaque dimanche : tests + contrôle robots.txt en direct
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: robots.txt autorise toujours nos chemins
        run: python scripts/check_robots.py

  # Round 4, item 20 : une PR qui casse le site (types, build, garde-fous) est rouge.
  # Sans secret, sans scripts d'installation, données d'échantillon (DATA_FIXTURE=1).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      DATA_FIXTURE: "1"
      NEXT_BUILD_CPUS: "2"
      NEXT_PUBLIC_SITE_URL: https://savradar.pages.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
