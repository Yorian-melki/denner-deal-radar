name: tests

on:
  push:
    paths-ignore: ["data/**", "site/data/**", "**.md"]
  pull_request:
  schedule:
    - cron: "41 4 * * 0"   # chaque dimanche : tests + contrôle robots.txt en direct
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: robots.txt autorise toujours nos chemins
        run: python scripts/check_robots.py
